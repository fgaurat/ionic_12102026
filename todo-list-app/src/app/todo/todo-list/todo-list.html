<table>
  <thead>
    <tr>
      <th>Id</th>
      <th>userId</th>
      <th>Title</th>
      <th>Completed</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    @for (todo of todos$ | async; track todo.id) {
      <tr>
        <td>{{ todo.id }}</td>
        <td>{{ todo.userId }}</td>
        <td>{{ todo.title }}</td>
        <td>{{ todo.completed }}</td>
        <td>
          <button (click)="delete(todo)">delete</button>
        </td>
      </tr>
    }
  </tbody>
</table>

<pre>

    {{ todos$ | async | json }}
</pre>
